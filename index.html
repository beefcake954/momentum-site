<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momentum — AI and systems for local businesses</title>
    <meta
      name="description"
      content="Sites, bots, and systems for local businesses in South Florida. Honest work, no guru language. Built in Pompano Beach."
    />
    <meta name="theme-color" content="#080808" />
    <link rel="preload" href="/fonts/press-start-2p-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" type="image/webp" imagesrcset="/momentum-logo-204.webp 204w, /momentum-logo-408.webp 408w" imagesizes="(min-width: 768px) 187px, 153px" />
  </head>
  <body>
    <!-- Pixel-arc loader. Lives in the HTML so it paints on the first frame,
         before the app bundle arrives. The app tells it when to leave. -->
    <div id="boot" class="boot" role="status" aria-live="polite" aria-busy="true">
      <img class="boot-scene" src="/loader/scene-bg.jpg" alt="" width="480" height="320" fetchpriority="high" decoding="async" />
      <div class="boot-vignette" aria-hidden="true"></div>
      <span class="boot-sr">Momentum is loading</span>
      <div class="boot-stage"><p class="boot-title" aria-hidden="true"></p></div>
    </div>
    <script>
      (function () {
        var KEY = "momentum:booted";
        var MIN_MS = 1800; // exit starts here; 600ms fade -> ~2.4s total
        var MIN_REDUCED_MS = 1100;
        var EXIT_MS = 600;
        var el = document.getElementById("boot");
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var seen = false;
        try { seen = sessionStorage.getItem(KEY) === "1"; } catch (e) {}
        var s = { app: false, min: false, done: false };

        function reveal() {
          if (s.done) return;
          s.done = true;
          window.dispatchEvent(new Event("momentum:reveal"));
          if (!el) return;
          el.classList.add("is-leaving");
          setTimeout(function () {
            el.remove();
            try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
          }, reduce ? 0 : EXIT_MS);
        }
        window.__momentumBoot = {
          revealed: function () { return s.done; },
          appReady: function () { s.app = true; if (s.min) reveal(); },
        };

        if (seen) { el.remove(); el = null; s.min = true; return; }

        // Build the arc: 8 letters, each an 11-layer extrusion plus a face.
        var title = "MOMENTUM", depth = 11, mid = (title.length - 1) / 2, html = "";
        for (var i = 0; i < title.length; i++) {
          var c = title[i], f = i - mid, layers = "";
          for (var l = 0; l < depth; l++) {
            layers += '<span class="boot-layer" style="transform:translate(' + l + "px," + l + "px);color:" + (l > depth - 3 ? "#070707" : "#161616") + '">' + c + "</span>";
          }
          html += '<span class="boot-wave" style="animation-delay:' + (i * 0.09).toFixed(2) + 's"><span class="boot-tilt" style="transform:rotate(' + (f * 7.2).toFixed(1) + "deg) translateY(" + (f * f * 4.1).toFixed(1) + 'px)">' + layers + '<span class="boot-face">' + c + "</span></span></span>";
        }
        el.querySelector(".boot-title").innerHTML = html;

        var shown = false;
        function show() { if (!shown) { shown = true; el.classList.add("is-ready"); } }
        if (document.fonts && document.fonts.load) document.fonts.load('400 64px "Press Start 2P"').then(show, show);
        setTimeout(show, 700);

        setTimeout(function () {
          s.min = true;
          if (s.app) reveal();
        }, Math.max(0, (reduce ? MIN_REDUCED_MS : MIN_MS) - performance.now()));
      })();
    </script>
    <!-- Header is static (no state), so it paints on the first frame. -->
    <header class="sticky top-0 z-30 border-b border-[var(--color-line)] bg-ink">
      <div class="mx-auto flex h-16 max-w-[1360px] items-center justify-between px-4 sm:px-6 md:h-[72px] md:px-10">
        <a href="#top" class="flex min-h-11 items-center" aria-label="Momentum, back to top">
          <picture>
            <source type="image/webp" srcset="/momentum-logo-204.webp 204w, /momentum-logo-408.webp 408w" sizes="(min-width: 768px) 187px, 153px" />
            <img src="/momentum-logo-408.png" alt="Momentum" width="204" height="48" fetchpriority="high" class="h-9 w-auto object-contain md:h-11" />
          </picture>
        </a>
        <nav aria-label="Primary" class="hidden items-center gap-10 font-mono text-[12px] tracking-[0.04em] text-[var(--color-mute)] md:flex">
          <a href="#marine" class="nav-link">Marine</a>
          <a href="#work" class="nav-link">Work</a>
          <a href="#packages" class="nav-link">Packages</a>
          <a href="#book" class="nav-link">Book</a>
        </nav>
        <a href="#book" class="inline-flex min-h-11 items-center border border-teal px-4 font-mono text-[11px] uppercase tracking-[0.12em] text-teal transition-colors duration-500 hover:bg-teal hover:text-ink">Book 20 min</a>
      </div>
    </header>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
